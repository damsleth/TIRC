[workspace]
members = [
  "crates/tirc-app",
  "crates/tirc-config",
  "crates/tirc-core",
  "crates/tirc-net",
  "crates/tirc-platform",
  "crates/tirc-ui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["TIRC Contributors"]
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.51", features = ["derive", "env"] }
crossterm = "0.29.0"
directories = "6.0.0"
futures = "0.3.31"
irc-proto = "1.1.0"
notify-rust = "4.12.0"
nucleo-matcher = "0.3.1"
rand = "0.9.2"
ratatui = "0.30.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tempfile = "3.25.0"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-native-tls = "0.3.1"
toml = "0.9.8"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
unicode-width = "0.2.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "allow"
