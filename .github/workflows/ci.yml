name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  integration-ircd:
    runs-on: ubuntu-latest
    services:
      inspircd:
        image: inspircd/inspircd-docker:latest
        ports:
          - 6667:6667
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Wait for IRC daemon
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/6667) >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "IRCd did not become reachable on 127.0.0.1:6667"
          exit 1
      - name: Run daemon integration tests
        env:
          TIRC_RUN_IRCD_TESTS: "1"
          TIRC_IRCD_HOST: "127.0.0.1"
          TIRC_IRCD_PORT: "6667"
        run: cargo test -p tirc-net --test ircd_integration -- --nocapture
